version: '3.8'
services:
  frontend:
    build: ./front
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: ./back/backend
    ports:
      - "5000:5000"
    depends_on:
      - db

  db:
    image: postgres:15-alpine  # works on Raspberry Pi
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: svetloupravljac
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

